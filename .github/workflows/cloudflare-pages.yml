name: Build and deploy PWA

on:
  workflow_dispatch:
  schedule:
    # KST 09:00, 13:00, 17:00, 21:00. Keep this modest to stay within free minutes.
    - cron: "0 0,4,8,12 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CF_PROJECT: ${{ vars.CF_PAGES_PROJECT_NAME || 'sweetproduct' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Build recommendation report
        run: python -m stock_ai recommend --top 10 --limit 0 --no-sentiment

      - name: Export mobile app
        run: python export_mobile_app.py

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: npx wrangler pages deploy mobile_app --project-name "$CF_PROJECT"

