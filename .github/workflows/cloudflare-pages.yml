name: Build and deploy PWA

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/cloudflare-pages.yml"
      - "functions/**"
      - "migrations/**"
      - "stock_ai/**"
      - "tests/**"
      - "export_mobile_app.py"
      - "manifest.webmanifest"
      - "sw.js"
      - "requirements.txt"
  schedule:
    # KST 07:00 & 09:00 (= UTC 22:00 & 00:00) — just after the US market close
    # (EDT 05:00 / EST 06:00 KST) so the build captures the latest daily close.
    # Two runs give resilience (retry) without redundant intraday rebuilds.
    - cron: "0 0,22 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CF_PROJECT: sweetproduct
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # data_cache/ 를 주간 단위로 캐싱해 매 실행마다 SEC EDGAR/yfinance 전체를
      # 다시 긁지 않도록 한다. 캐시 미스 시에도 코드 내 7일 TTL이 최신성을 보장한다.
      # GitHub Actions 캐시 기본 한도(저장소당 10GB) 안에서만 쓴다. 한도 상향은
      # 비용 위험이므로 사용자 승인 없이 설정하지 않는다.
      - name: Compute weekly cache key
        id: cachekey
        shell: bash
        run: echo "week=$(date -u +%Y-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache market/SEC data
        uses: actions/cache@v4
        with:
          path: data_cache
          key: data-cache-${{ steps.cachekey.outputs.week }}
          restore-keys: |
            data-cache-

      - name: Run tests
        run: pytest -q

      - name: Build recommendation report
        run: python -m stock_ai recommend --top 10 --limit 0

      - name: Export mobile app
        run: python export_mobile_app.py

      - name: Write Cloudflare Pages config
        if: ${{ env.CLOUDFLARE_D1_DATABASE_ID != '' }}
        shell: bash
        run: |
          cat > wrangler.toml <<EOF
          name = "${CF_PROJECT}"
          compatibility_date = "2025-01-01"
          pages_build_output_dir = "mobile_app"

          [[d1_databases]]
          binding = "DB"
          database_name = "sp-profit-plan-holdings"
          database_id = "${CLOUDFLARE_D1_DATABASE_ID}"
          migrations_dir = "migrations"

          [vars]
          QUOTE_TTL_SECONDS = "300"
          EOF

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_D1_DATABASE_ID != '' }}
        run: npx wrangler@4 pages deploy mobile_app --project-name "$CF_PROJECT"
