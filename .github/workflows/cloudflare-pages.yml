name: Build and deploy PWA

on:
  workflow_dispatch:
  schedule:
    # KST 09:00, 13:00, 17:00, 21:00. Keep this modest to stay within free minutes.
    - cron: "0 0,4,8,12 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CF_PROJECT: ${{ vars.CF_PAGES_PROJECT_NAME || 'sweetproduct' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Build recommendation report
        run: python -m stock_ai recommend --top 10 --limit 0 --no-sentiment

      - name: Export mobile app
        run: python export_mobile_app.py

      - name: Write Cloudflare Pages config
        if: ${{ env.CLOUDFLARE_D1_DATABASE_ID != '' }}
        shell: bash
        run: |
          cat > wrangler.toml <<EOF
          name = "${CF_PROJECT}"
          compatibility_date = "2026-06-09"
          pages_build_output_dir = "mobile_app"

          [[d1_databases]]
          binding = "DB"
          database_name = "sp-profit-plan-holdings"
          database_id = "${CLOUDFLARE_D1_DATABASE_ID}"
          migrations_dir = "migrations"

          [vars]
          QUOTE_TTL_SECONDS = "300"
          EOF

      - name: Deploy to Cloudflare Pages
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.CLOUDFLARE_D1_DATABASE_ID != '' }}
        run: npx wrangler pages deploy mobile_app --project-name "$CF_PROJECT"
